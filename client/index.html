<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090e" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="BatchMate: find scholarships you actually qualify for, track applications and prep for aptitude tests."
    />
    <meta property="og:title" content="BatchMate — Scholarships, matched" />
    <meta property="og:description" content="Find scholarships you actually qualify for. Free, private, no Aadhaar required." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BatchMate — Scholarships, matched</title>
    <script>
      // Apply the stored theme before first paint (dark is default).
      try {
        if (localStorage.getItem('bm-theme') === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6fb');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
