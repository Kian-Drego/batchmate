# Render blueprint for the BatchMate API (Express + MongoDB).
#
# Usage: on https://render.com choose "New → Blueprint", point it at this repo,
# then supply MONGO_URI (a MongoDB Atlas connection string) when prompted.
# Render generates JWT_SECRET automatically and sets PORT for you.
services:
  - type: web
    name: batchmate-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --workspace server run build
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Browser origin allowed to call the API. Add more comma-separated origins
      # if you also use a preview/staging URL.
      - key: CLIENT_ORIGIN
        value: https://batchmate.duckdns.org
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      # "local" writes uploads to the instance disk. Render's free instance disk
      # is ephemeral, so switch to s3/supabase for durable documents.
      - key: STORAGE_DRIVER
        value: local
      # Skip heavy optional tooling downloads during install.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
