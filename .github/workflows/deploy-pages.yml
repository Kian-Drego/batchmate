name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

# Server-only tooling (Playwright / in-memory Mongo) is irrelevant to the
# client build — skip their heavy post-install downloads.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  MONGOMS_DISABLE_POSTINSTALL: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        # Set the repository variable VITE_API_URL to the deployed API origin
        # (Settings → Secrets and variables → Actions → Variables), e.g.
        # https://batchmate-api.onrender.com
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm --workspace client run build

      - name: Add SPA fallback for client-side routes
        # GitHub Pages serves 404.html for unknown paths; serving the app shell
        # there lets React Router resolve deep links like /dashboard.
        run: cp client/dist/index.html client/dist/404.html

      # Pages must be enabled once in repo Settings → Pages (Source: GitHub
      # Actions); this step then reads the existing configuration.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
